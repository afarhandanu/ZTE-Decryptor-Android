name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n "s/.*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Verify stable signing files
        shell: bash
        run: |
          test -f signing/keystore.properties
          STORE_FILE="$(sed -n 's/^storeFile=//p' signing/keystore.properties | tr -d '\r' | head -n 1)"
          if [ -z "$STORE_FILE" ]; then
            echo "storeFile is missing in signing/keystore.properties"
            exit 1
          fi
          test -f "signing/$STORE_FILE"
          echo "Stable signing files found."

      - name: Run codec smoke test
        run: |
          mkdir -p build-smoke
          javac -d build-smoke             app/src/main/java/com/sione/ztetype6/XmlConfigTools.java             app/src/main/java/com/sione/ztetype6/crypto/ZteType6Codec.java             tools/CodecSmokeTest.java
          java -cp build-smoke CodecSmokeTest

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare named APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk              "dist/ZTE-Decryptor-Android-v${{ steps.version.outputs.version }}.apk"
          ls -lh dist/

      - name: Show signing certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --print-certs             "dist/ZTE-Decryptor-Android-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Decryptor-Android-v${{ steps.version.outputs.version }}
          path: dist/ZTE-Decryptor-Android-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
