plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sione.ztetype6'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sione.ztetype6'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.2.3'
    }

    def keystoreProperties = new java.util.Properties()
    def keystorePropertiesFile = rootProject.file('signing/keystore.properties')
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException('Stable signing configuration is missing: signing/keystore.properties')
    }
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }

    signingConfigs {
        stable {
            storeFile rootProject.file("signing/${keystoreProperties['storeFile']}")
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
